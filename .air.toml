# ============================================
# Air Configuration for NATS Framework
# ============================================

root = "."
tmp_dir = "tmp"

[build]
  args_bin = ["serve", "--debug"]
  bin = "./tmp/nats"
  cmd = "go build -o ./tmp/nats ./cmd/nats/main.go"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "storage", "node_modules", "dist"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "json", "env"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  prefix = ""
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true