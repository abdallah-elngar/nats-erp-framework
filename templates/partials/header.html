<header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 sticky top-0 z-50">
    <div class="container mx-auto px-4">
        <div class="flex items-center justify-between h-16">
            <div class="flex items-center gap-3">
                <button @click="toggleSidebar()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 lg:hidden">
                    <i class="fas fa-bars text-gray-700 dark:text-gray-300"></i>
                </button>
                <a href="/" class="flex items-center gap-2">
                    <img src="/static/images/logo.svg" alt="NATS" class="h-8 w-8">
                    <span class="text-xl font-bold text-primary-600 dark:text-primary-400">NATS ERP</span>
                </a>
            </div>
            
            <div class="flex items-center gap-3">
                <button @click="theme = theme === 'light' ? 'dark' : 'light'; localStorage.setItem('theme', theme)" 
                        class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
                    <i class="fas fa-moon text-gray-700 dark:text-gray-300" x-show="theme === 'light'"></i>
                    <i class="fas fa-sun text-gray-700 dark:text-gray-300" x-show="theme === 'dark'"></i>
                </button>
                
                <a href="/admin" class="btn btn-primary btn-sm">
                    <i class="fas fa-user-shield mr-2"></i>Admin
                </a>
            </div>
        </div>
    </div>
</header>
