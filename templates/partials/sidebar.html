{{define "admin_sidebar"}}
<aside x-show="sidebarOpen"
       x-transition:enter="transition ease-out duration-300"
       x-transition:enter-start="-translate-x-full"
       x-transition:enter-end="translate-x-0"
       x-transition:leave="transition ease-in duration-300"
       x-transition:leave-start="translate-x-0"
       x-transition:leave-end="-translate-x-full"
       class="fixed top-16 left-0 bottom-0 w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 overflow-y-auto z-40 transition-colors">
    
    <nav class="p-4 space-y-1">
        <!-- Dashboard -->
        <a href="/admin" class="flex items-center gap-3 px-4 py-2 rounded-lg transition-colors {{if .ActiveDashboard}}bg-gray-100 dark:bg-gray-700 text-primary-600 dark:text-primary-400{{else}}text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700{{end}}">
            <i class="fas fa-home text-gray-500 dark:text-gray-400 w-5"></i>
            <span>Dashboard</span>
        </a>
        
        <!-- Users -->
        <a href="/admin/users" class="flex items-center gap-3 px-4 py-2 rounded-lg transition-colors {{if .ActiveUsers}}bg-gray-100 dark:bg-gray-700 text-primary-600 dark:text-primary-400{{else}}text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700{{end}}">
            <i class="fas fa-users text-gray-500 dark:text-gray-400 w-5"></i>
            <span>Users</span>
        </a>
        
        <!-- Roles -->
        <a href="/admin/roles" class="flex items-center gap-3 px-4 py-2 rounded-lg transition-colors {{if .ActiveRoles}}bg-gray-100 dark:bg-gray-700 text-primary-600 dark:text-primary-400{{else}}text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700{{end}}">
            <i class="fas fa-user-tag text-gray-500 dark:text-gray-400 w-5"></i>
            <span>Roles</span>
        </a>
        
        <!-- Permissions -->
        <a href="/admin/permissions" class="flex items-center gap-3 px-4 py-2 rounded-lg transition-colors {{if .ActivePermissions}}bg-gray-100 dark:bg-gray-700 text-primary-600 dark:text-primary-400{{else}}text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700{{end}}">
            <i class="fas fa-lock text-gray-500 dark:text-gray-400 w-5"></i>
            <span>Permissions</span>
        </a>
        
        <!-- Apps -->
        <a href="/admin/apps" class="flex items-center gap-3 px-4 py-2 rounded-lg transition-colors {{if .ActiveApps}}bg-gray-100 dark:bg-gray-700 text-primary-600 dark:text-primary-400{{else}}text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700{{end}}">
            <i class="fas fa-th-large text-gray-500 dark:text-gray-400 w-5"></i>
            <span>Apps</span>
        </a>
        
        <hr class="my-4 border-gray-200 dark:border-gray-700">
        
        <!-- Settings -->
        <a href="/admin/settings" class="flex items-center gap-3 px-4 py-2 rounded-lg transition-colors {{if .ActiveSettings}}bg-gray-100 dark:bg-gray-700 text-primary-600 dark:text-primary-400{{else}}text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700{{end}}">
            <i class="fas fa-cog text-gray-500 dark:text-gray-400 w-5"></i>
            <span>Settings</span>
        </a>
        
        <!-- Backup -->
        <a href="/admin/backup" class="flex items-center gap-3 px-4 py-2 rounded-lg transition-colors {{if .ActiveBackup}}bg-gray-100 dark:bg-gray-700 text-primary-600 dark:text-primary-400{{else}}text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700{{end}}">
            <i class="fas fa-database text-gray-500 dark:text-gray-400 w-5"></i>
            <span>Backup</span>
        </a>
        
        <!-- Logs -->
        <a href="/admin/logs" class="flex items-center gap-3 px-4 py-2 rounded-lg transition-colors {{if .ActiveLogs}}bg-gray-100 dark:bg-gray-700 text-primary-600 dark:text-primary-400{{else}}text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700{{end}}">
            <i class="fas fa-history text-gray-500 dark:text-gray-400 w-5"></i>
            <span>Logs</span>
        </a>
    </nav>
</aside>
{{end}}
