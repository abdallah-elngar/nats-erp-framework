{{define "admin_navbar"}}
<nav class="fixed top-0 left-0 right-0 z-50 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 h-16 transition-colors">
    <div class="flex items-center justify-between h-full px-4">
        <!-- Left -->
        <div class="flex items-center gap-3">
            <button @click="toggleSidebar()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
                <i class="fas fa-bars text-gray-700 dark:text-gray-300 text-xl"></i>
            </button>
            <a href="/admin" class="flex items-center gap-2">
                <img src="/static/images/logo.svg" alt="NATS" class="h-8 w-8">
                <span class="text-xl font-bold text-primary-600 dark:text-primary-400 hidden sm:block">NATS ERP</span>
            </a>
        </div>
        
        <!-- Right -->
        <div class="flex items-center gap-3">
            <!-- Theme Toggle -->
            <button @click="toggleTheme()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
                <i class="fas fa-moon text-gray-700 dark:text-gray-300" x-show="theme === 'light'"></i>
                <i class="fas fa-sun text-gray-700 dark:text-gray-300" x-show="theme === 'dark'"></i>
            </button>
            
            <!-- Notifications -->
            <div class="relative" x-data="{ open: false }">
                <button @click="open = !open" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 relative">
                    <i class="fas fa-bell text-gray-700 dark:text-gray-300"></i>
                    <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full" x-show="notifications.length > 0"></span>
                </button>
                <div x-show="open" @click.away="open = false"
                     class="absolute right-0 mt-2 w-80 bg-white dark:bg-gray-800 rounded-lg shadow-lg border border-gray-200 dark:border-gray-700 max-h-96 overflow-y-auto">
                    <div class="p-3 border-b border-gray-200 dark:border-gray-700">
                        <h3 class="font-semibold text-gray-900 dark:text-gray-100">Notifications</h3>
                    </div>
                    <div class="divide-y divide-gray-200 dark:divide-gray-700">
                        <template x-for="notification in notifications" :key="notification.id">
                            <div class="p-3 hover:bg-gray-50 dark:hover:bg-gray-700">
                                <p class="text-sm text-gray-900 dark:text-gray-100" x-text="notification.message"></p>
                                <span class="text-xs text-gray-500" x-text="new Date(notification.timestamp).toLocaleString()"></span>
                            </div>
                        </template>
                        <template x-if="notifications.length === 0">
                            <div class="p-4 text-center text-gray-500 dark:text-gray-400">No notifications</div>
                        </template>
                    </div>
                </div>
            </div>
            
            <!-- User Menu -->
            <div class="relative" x-data="{ open: false }">
                <button @click="open = !open" class="flex items-center gap-2 p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
                    <div class="w-8 h-8 rounded-full bg-primary-500 flex items-center justify-center text-white font-bold text-sm">
                        {{.User.Initials}}
                    </div>
                    <span class="text-sm text-gray-700 dark:text-gray-300 hidden sm:block">{{.User.FullName}}</span>
                    <i class="fas fa-chevron-down text-xs text-gray-500"></i>
                </button>
                <div x-show="open" @click.away="open = false"
                     class="absolute right-0 mt-2 w-48 bg-white dark:bg-gray-800 rounded-lg shadow-lg border border-gray-200 dark:border-gray-700">
                    <div class="py-1">
                        <a href="/admin/profile" class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                            <i class="fas fa-user mr-2"></i>Profile
                        </a>
                        <a href="/admin/settings" class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                            <i class="fas fa-cog mr-2"></i>Settings
                        </a>
                        <hr class="my-1 border-gray-200 dark:border-gray-700">
                        <button @click="logout()" class="w-full text-left block px-4 py-2 text-sm text-red-600 dark:text-red-400 hover:bg-gray-100 dark:hover:bg-gray-700">
                            <i class="fas fa-sign-out-alt mr-2"></i>Logout
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</nav>
{{end}}
