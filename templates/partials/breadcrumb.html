<nav aria-label="Breadcrumb">
    <ol class="flex items-center gap-2 text-sm">
        <li>
            <a href="/" class="text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300">
                <i class="fas fa-home"></i>
            </a>
        </li>
        {{range .Breadcrumbs}}
        <li>
            <span class="text-gray-400 dark:text-gray-600">/</span>
            {{if .Active}}
            <span class="text-gray-900 dark:text-gray-100 font-medium">{{.Label}}</span>
            {{else}}
            <a href="{{.URL}}" class="text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300">{{.Label}}</a>
            {{end}}
        </li>
        {{end}}
    </ol>
</nav>
