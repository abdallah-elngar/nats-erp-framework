{{define "sidebar"}}
<div class="sidebar fixed left-0 top-0 h-full w-64 bg-gray-900 text-white p-4 overflow-y-auto z-50">
    <div class="logo text-xl font-bold mb-8 pb-4 border-b border-gray-700">
        🏢 NATS <span class="text-indigo-400">ERP</span>
    </div>
    <nav class="space-y-1">
        <a @click="currentView = 'dashboard'" :class="currentView === 'dashboard' ? 'active bg-gray-800' : ''" 
           class="flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-800 cursor-pointer transition">
            <span>📊</span> Dashboard
        </a>
        <a @click="currentView = 'apps'" :class="currentView === 'apps' ? 'active bg-gray-800' : ''"
           class="flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-800 cursor-pointer transition">
            <span>📦</span> Applications
        </a>
        <a @click="currentView = 'users'" :class="currentView === 'users' ? 'active bg-gray-800' : ''"
           class="flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-800 cursor-pointer transition">
            <span>👤</span> Users
        </a>
        <a @click="currentView = 'relations'" :class="currentView === 'relations' ? 'active bg-gray-800' : ''"
           class="flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-800 cursor-pointer transition">
            <span>🔗</span> Relations
        </a>
        <div class="border-t border-gray-700 my-4"></div>
        <a @click="currentView = 'migrations'" :class="currentView === 'migrations' ? 'active bg-gray-800' : ''"
           class="flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-800 cursor-pointer transition">
            <span>🗄️</span> Migrations
        </a>
        <a @click="currentView = 'settings'" :class="currentView === 'settings' ? 'active bg-gray-800' : ''"
           class="flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-800 cursor-pointer transition">
            <span>⚙️</span> Settings
        </a>
    </nav>
</div>
{{end}}
