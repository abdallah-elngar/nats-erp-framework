{{ define "components/navbar" }}
<!-- Top Navbar -->
<nav class="navbar-custom rounded-lg p-4 mb-6 flex justify-between items-center">
    <!-- Right Side -->
    <div class="flex items-center gap-3">
        <button class="lg:hidden text-gray-600 hover:text-gray-800" @click="toggleSidebar()">
            <i class="fas fa-bars text-xl"></i>
        </button>
        <span class="text-gray-600" x-text="pageTitle">لوحة التحكم</span>
        <span class="text-xs text-gray-400" x-show="mode === 'developer'">(وضع المطور)</span>
        <span class="text-xs text-green-400" x-show="mode === 'production'">(وضع المستخدم)</span>
    </div>
    
    <!-- Left Side -->
    <div class="flex items-center gap-4">
        <!-- Search -->
        <div class="relative hidden md:block" x-data="{ open: false }">
            <input type="text" placeholder="بحث..." 
                   class="w-48 px-3 py-1.5 pr-8 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                   @focus="open = true" @blur="setTimeout(() => open = false, 200)">
            <i class="fas fa-search absolute left-2 top-2 text-gray-400 text-sm"></i>
            <div x-show="open" class="absolute top-full left-0 right-0 mt-1 bg-white rounded-lg shadow-lg border border-gray-200 py-2 z-50">
                <div class="px-3 py-1 text-xs text-gray-400">نتائج البحث...</div>
            </div>
        </div>
        
        <!-- Notifications -->
        <div class="relative" x-data="{ open: false }">
            <button @click="open = !open" class="text-gray-600 hover:text-gray-800 relative">
                <i class="fas fa-bell text-xl"></i>
                <span class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white text-xs rounded-full flex items-center justify-center"
                      x-show="notifications.length > 0" x-text="notifications.length">0</span>
            </button>
            <div x-show="open" @click.away="open = false"
                 class="absolute left-0 mt-2 w-80 bg-white rounded-lg shadow-lg border border-gray-200 py-2 z-50 max-h-96 overflow-y-auto">
                <div class="px-4 py-2 border-b border-gray-100 font-medium text-sm">الإشعارات</div>
                <template x-for="notif in notifications" :key="notif.id">
                    <div class="px-4 py-2 hover:bg-gray-50 cursor-pointer border-b border-gray-50">
                        <div class="text-sm" x-text="notif.message"></div>
                        <div class="text-xs text-gray-400" x-text="notif.time"></div>
                    </div>
                </template>
                <div x-show="notifications.length === 0" class="px-4 py-3 text-sm text-gray-400 text-center">
                    لا توجد إشعارات
                </div>
            </div>
        </div>
        
        <!-- User -->
        <div class="relative" x-data="{ open: false }">
            <button @click="open = !open" class="flex items-center gap-2 text-gray-600 hover:text-gray-800">
                <div class="w-8 h-8 rounded-full bg-indigo-500 text-white flex items-center justify-center font-bold text-sm">
                    {{ user | get "initial" | default "A" }}
                </div>
                <span class="hidden md:block text-sm" x-text="user.username || 'Admin'"></span>
                <i class="fas fa-chevron-down text-xs"></i>
            </button>
            <div x-show="open" @click.away="open = false"
                 class="absolute left-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-1 z-50">
                <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                    <i class="fas fa-user me-2"></i>الملف الشخصي
                </a>
                <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                    <i class="fas fa-cog me-2"></i>الإعدادات
                </a>
                <hr class="my-1">
                <a href="#" class="block px-4 py-2 text-sm text-red-600 hover:bg-gray-100">
                    <i class="fas fa-sign-out-alt me-2"></i>تسجيل الخروج
                </a>
            </div>
        </div>
    </div>
</nav>
{{ end }}
