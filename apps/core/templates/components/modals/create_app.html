{{ define "components/modals/create_app" }}
<div class="modal" x-show="showCreateApp" @click.away="showCreateApp = false" x-cloak>
    <div class="modal-content max-w-2xl">
        <!-- Header -->
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold text-gray-800">
                <i class="fas fa-plus-circle text-indigo-500 me-2"></i>إنشاء تطبيق جديد
            </h2>
            <button class="text-gray-400 hover:text-gray-600 text-2xl" @click="showCreateApp = false">✕</button>
        </div>
        
        <!-- Form -->
        <form @submit.prevent="executeCreateApp()" class="space-y-4">
            <!-- App Name -->
            <div class="form-group">
                <label class="form-label">اسم التطبيق <span class="text-red-500">*</span></label>
                <input type="text" x-model="newApp.name" class="form-control" 
                       placeholder="مثال: hr, inventory, accounting" required>
                <p class="form-hint">استخدم أحرف صغيرة وشرطات سفلية (مثال: hr_management)</p>
            </div>
            
            <!-- Description -->
            <div class="form-group">
                <label class="form-label">الوصف</label>
                <input type="text" x-model="newApp.description" class="form-control" 
                       placeholder="وصف التطبيق">
            </div>
            
            <!-- Parent App -->
            <div class="form-group">
                <label class="form-label">التطبيق الأب</label>
                <select x-model="newApp.parent" class="form-control">
                    <option value="core">Core (النظام الأساسي)</option>
                    <template x-for="app in apps" :key="app.name">
                        <option :value="app.name" x-text="app.name"></option>
                    </template>
                </select>
                <p class="form-hint">التطبيق الذي سيرث منه هذا التطبيق</p>
            </div>
            
            <!-- Models -->
            <div class="form-group">
                <label class="form-label">النماذج</label>
                <div>
                    <template x-for="(model, index) in newApp.models" :key="index">
                        <div class="field-row">
                            <input type="text" x-model="model.name" class="form-control" 
                                   placeholder="اسم النموذج (مثال: Employee)">
                            <input type="text" x-model="model.fields" class="form-control" 
                                   placeholder="الحقول: name:string, email:string">
                            <button type="button" class="btn btn-danger btn-sm" 
                                    @click="newApp.models.splice(index, 1)">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </template>
                    <button type="button" class="btn btn-secondary btn-sm mt-2" 
                            @click="newApp.models.push({name: '', fields: ''})">
                        <i class="fas fa-plus me-1"></i> إضافة نموذج
                    </button>
                </div>
                <p class="form-hint">تنسيق الحقول: name:string, email:string, age:int, hire_date:date</p>
            </div>
            
            <!-- CRUD Option -->
            <div class="form-group">
                <label class="form-label">إنشاء CRUD</label>
                <select x-model="newApp.crud" class="form-control">
                    <option value="yes">نعم - إنشاء CRUD كامل</option>
                    <option value="no">لا - نماذج فقط</option>
                </select>
            </div>
            
            <!-- Migration Info -->
            <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-3 text-sm text-yellow-700">
                <i class="fas fa-info-circle me-2"></i>
                سيتم إنشاء هجرات (Migrations) تلقائياً عند إنشاء التطبيق.
            </div>
            
            <!-- Actions -->
            <div class="flex justify-end gap-2 pt-4 border-t border-gray-200">
                <button type="button" class="btn btn-secondary" @click="showCreateApp = false">
                    إلغاء
                </button>
                <button type="submit" class="btn btn-primary" :disabled="creating">
                    <span x-show="!creating">
                        <i class="fas fa-rocket me-2"></i>إنشاء
                    </span>
                    <span x-show="creating">
                        <i class="fas fa-spinner fa-spin me-2"></i>جاري...
                    </span>
                </button>
            </div>
        </form>
    </div>
</div>
{{ end }}
