{{define "modal_add_field"}}
<div class="modal fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" 
     x-show="showAddField" 
     @click.away="showAddField = false"
     x-cloak>
    <div class="modal-content bg-white rounded-xl p-6 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
        <button class="close-btn float-right bg-none border-none text-2xl cursor-pointer text-gray-400 hover:text-gray-600" @click="showAddField = false">✕</button>
        <h2 class="text-xl font-bold text-gray-800 mb-4">✏️ Add New Field</h2>
        
        <form @submit.prevent="executeAddField()">
            <div class="form-group mb-4">
                <label class="form-label block text-sm font-medium text-gray-700 mb-1">Field Name *</label>
                <input type="text" x-model="newField.name" 
                       class="form-control w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                       placeholder="e.g., email, phone, salary" required>
                <small class="form-hint text-xs text-gray-500 mt-1">Use lowercase letters and underscores (e.g., employee_email)</small>
            </div>
            
            <div class="form-group mb-4">
                <label class="form-label block text-sm font-medium text-gray-700 mb-1">Field Type *</label>
                <select x-model="newField.type" 
                        class="form-control w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                    <option value="string">String (VARCHAR)</option>
                    <option value="text">Text</option>
                    <option value="int">Integer</option>
                    <option value="float">Float</option>
                    <option value="bool">Boolean</option>
                    <option value="date">Date</option>
                    <option value="datetime">DateTime</option>
                    <option value="time">Time</option>
                    <option value="json">JSON</option>
                    <option value="relation">Relation (Foreign Key)</option>
                </select>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div class="form-group mb-4">
                    <label class="form-label block text-sm font-medium text-gray-700 mb-1">Required</label>
                    <select x-model="newField.required" class="form-control w-full px-3 py-2 border border-gray-300 rounded-lg">
                        <option value="false">No</option>
                        <option value="true">Yes</option>
                    </select>
                </div>
                <div class="form-group mb-4">
                    <label class="form-label block text-sm font-medium text-gray-700 mb-1">Unique</label>
                    <select x-model="newField.unique" class="form-control w-full px-3 py-2 border border-gray-300 rounded-lg">
                        <option value="false">No</option>
                        <option value="true">Yes</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group mb-4" x-show="newField.type === 'relation'">
                <label class="form-label block text-sm font-medium text-gray-700 mb-1">Related Model</label>
                <input type="text" x-model="newField.relatedModel" 
                       class="form-control w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                       placeholder="e.g., User, Department">
                <small class="form-hint text-xs text-gray-500 mt-1">The model this field relates to</small>
            </div>
            
            <div class="form-group mb-4">
                <label class="form-label block text-sm font-medium text-gray-700 mb-1">Default Value (optional)</label>
                <input type="text" x-model="newField.default" 
                       class="form-control w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                       placeholder="e.g., 0, '', true">
            </div>
            
            <!-- Migration Warning -->
            <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 my-4 rounded" x-show="newField.name">
                <div class="flex items-start">
                    <div class="flex-shrink-0">
                        <span class="text-yellow-500 text-xl">⚠️</span>
                    </div>
                    <div class="ml-3">
                        <p class="text-sm text-yellow-700 font-medium">Migration Required!</p>
                        <p class="text-sm text-yellow-600 mt-1">Adding a new field will require a database migration.</p>
                        <p class="text-sm text-yellow-600">After saving, click <strong>"Run Migration"</strong> to update the database.</p>
                    </div>
                </div>
            </div>
            
            <div class="modal-actions flex justify-end gap-2 mt-6 pt-4 border-t border-gray-200">
                <button type="button" class="btn btn-secondary px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition" @click="showAddField = false">Cancel</button>
                <button type="submit" class="btn btn-primary px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition" :disabled="addingField">
                    <span x-show="!addingField">💾 Save Field</span>
                    <span x-show="addingField">⏳ Saving...</span>
                </button>
            </div>
        </form>
    </div>
</div>
{{end}}
