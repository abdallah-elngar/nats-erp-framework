{{define "modal_create_app"}}
<div class="modal fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" 
     x-show="showCreateApp" 
     @click.away="showCreateApp = false"
     x-cloak>
    <div class="modal-content bg-white rounded-xl p-6 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
        <button class="close-btn float-right bg-none border-none text-2xl cursor-pointer text-gray-400 hover:text-gray-600" @click="showCreateApp = false">✕</button>
        <h2 class="text-xl font-bold text-gray-800 mb-4">📱 Create New Application</h2>
        
        <form @submit.prevent="executeCreateApp()">
            <div class="form-group mb-4">
                <label class="form-label block text-sm font-medium text-gray-700 mb-1">Application Name *</label>
                <input type="text" x-model="newApp.name" 
                       class="form-control w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                       placeholder="e.g., hr, inventory, accounting" required>
                <small class="form-hint text-xs text-gray-500 mt-1">Use lowercase letters and underscores (e.g., hr_management)</small>
            </div>
            
            <div class="form-group mb-4">
                <label class="form-label block text-sm font-medium text-gray-700 mb-1">Description</label>
                <input type="text" x-model="newApp.description" 
                       class="form-control w-full px-3 py-2 border border-gray-300 rounded-lg"
                       placeholder="e.g., Human Resources Management">
            </div>
            
            <div class="form-group mb-4">
                <label class="form-label block text-sm font-medium text-gray-700 mb-1">Parent App</label>
                <select x-model="newApp.parent" class="form-control w-full px-3 py-2 border border-gray-300 rounded-lg">
                    <option value="core">Core</option>
                    <template x-for="app in apps" :key="app.name">
                        <option :value="app.name" x-text="app.name"></option>
                    </template>
                </select>
                <small class="form-hint text-xs text-gray-500 mt-1">Select the parent application for this app</small>
            </div>
            
            <div class="form-group mb-4">
                <label class="form-label block text-sm font-medium text-gray-700 mb-1">Models</label>
                <div>
                    <template x-for="(model, index) in newApp.models" :key="index">
                        <div class="field-row flex items-center gap-2 p-2 bg-gray-50 rounded-lg mb-2">
                            <input type="text" x-model="model.name" 
                                   class="flex-1 px-3 py-1 border border-gray-300 rounded-lg"
                                   placeholder="Model name (e.g., Employee)">
                            <input type="text" x-model="model.fields" 
                                   class="flex-1 px-3 py-1 border border-gray-300 rounded-lg"
                                   placeholder="fields: name:string, email:string">
                            <button class="btn btn-danger btn-sm px-2 py-1 bg-red-500 text-white rounded hover:bg-red-600" @click="newApp.models.splice(index, 1)">✕</button>
                        </div>
                    </template>
                    <button class="btn btn-secondary btn-sm px-3 py-1 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition" @click="newApp.models.push({name: '', fields: ''})">➕ Add Model</button>
                </div>
                <small class="form-hint text-xs text-gray-500 mt-1">Fields format: name:string, email:string, age:int, hire_date:date</small>
            </div>
            
            <div class="form-group mb-4">
                <label class="form-label block text-sm font-medium text-gray-700 mb-1">Generate CRUD?</label>
                <select x-model="newApp.crud" class="form-control w-full px-3 py-2 border border-gray-300 rounded-lg">
                    <option value="yes">Yes - Generate full CRUD</option>
                    <option value="no">No - Only models</option>
                </select>
            </div>
            
            <div class="modal-actions flex justify-end gap-2 mt-6 pt-4 border-t border-gray-200">
                <button type="button" class="btn btn-secondary px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition" @click="showCreateApp = false">Cancel</button>
                <button type="submit" class="btn btn-primary px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition" :disabled="creating">
                    <span x-show="!creating">🚀 Create App</span>
                    <span x-show="creating">⏳ Creating...</span>
                </button>
            </div>
        </form>
    </div>
</div>
{{end}}
