{{ extends "layouts/admin" }}

{{ define "title" }}⚙️ الإعدادات{{ end }}

{{ define "content" }}
<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
    <h2 class="text-xl font-bold text-gray-800 mb-4">
        <i class="fas fa-cog text-indigo-500 me-2"></i>إعدادات النظام
    </h2>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="form-group">
            <label class="form-label">اسم التطبيق</label>
            <input type="text" class="form-control" value="NATS ERP">
        </div>
        <div class="form-group">
            <label class="form-label">البيئة</label>
            <select class="form-control">
                <option value="development">تطوير</option>
                <option value="staging">اختبار</option>
                <option value="production">إنتاج</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">المنطقة الزمنية</label>
            <select class="form-control">
                <option value="UTC">UTC</option>
                <option value="Africa/Cairo">القاهرة</option>
                <option value="Asia/Riyadh">الرياض</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">اللغة</label>
            <select class="form-control">
                <option value="ar">العربية</option>
                <option value="en">English</option>
            </select>
        </div>
    </div>
    
    <div class="flex justify-end mt-6 pt-4 border-t border-gray-200">
        <button class="btn btn-primary" @click="saveSettings()">
            <i class="fas fa-save me-2"></i>حفظ الإعدادات
        </button>
    </div>
</div>

<script>
function settingsPage() {
    return {
        saveSettings() {
            this.showToast('✅ تم حفظ الإعدادات بنجاح!', 'success');
        },
        showToast(message, type) {
            var container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                container.style.cssText = 'position: fixed; bottom: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 8px;';
                document.body.appendChild(container);
            }
            var toast = document.createElement('div');
            var colors = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                info: 'bg-blue-500'
            };
            toast.className = 'text-white px-4 py-3 rounded-lg shadow-lg ' + (colors[type] || colors.info);
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(function() {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(function() { toast.remove(); }, 300);
            }, 3000);
        }
    };
}
</script>
{{ end }}
