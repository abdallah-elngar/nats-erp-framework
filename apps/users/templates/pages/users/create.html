{{define "content"}}
<div class="p-6">
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-gray-900 dark:text-gray-100">Create New User</h2>
        <button class="text-gray-500 hover:text-gray-700" @click="showModal = false">
            <i class="fas fa-times"></i>
        </button>
    </div>
    
    <form hx-post="/api/users" hx-target="#modal-content" hx-swap="innerHTML" data-validate>
        <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="Choose a username" required minlength="3" maxlength="50">
        </div>
        
        <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Enter email" required>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="full_name">Full Name</label>
            <input type="text" class="form-control" id="full_name" name="full_name" placeholder="Enter full name">
        </div>
        
        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Create password" required minlength="8">
        </div>
        
        <div class="form-group">
            <label class="form-label" for="role">Role</label>
            <select class="form-control" id="role" name="role">
                <option value="">Select a role</option>
                {{range .Roles}}
                <option value="{{.Name}}">{{.DisplayName}}</option>
                {{end}}
            </select>
        </div>
        
        <div class="flex justify-end gap-2 mt-4">
            <button type="button" class="btn btn-secondary" @click="showModal = false">Cancel</button>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-user-plus mr-2"></i>Create User
            </button>
        </div>
    </form>
</div>
{{end}}
