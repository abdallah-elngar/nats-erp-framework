{{define "content"}}
<div class="container mx-auto p-4">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">👥 Users</h1>
        <button class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600"
                hx-get="/users/create" hx-target="#modal-content" hx-trigger="click">
            <i class="fas fa-plus mr-2"></i>Add User
        </button>
    </div>
    
    <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="w-full">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Username</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Full Name</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
                {{range .Users}}
                <tr>
                    <td class="px-6 py-4">{{.ID}}</td>
                    <td class="px-6 py-4">{{.Username}}</td>
                    <td class="px-6 py-4">{{.Email}}</td>
                    <td class="px-6 py-4">{{.FullName}}</td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 text-xs rounded-full {{if eq .Status "active"}}bg-green-100 text-green-800{{else}}bg-red-100 text-red-800{{end}}">
                            {{.Status}}
                        </span>
                    </td>
                    <td class="px-6 py-4">
                        <button class="text-blue-500 hover:text-blue-700 mr-2"
                                hx-get="/users/{{.ID}}" hx-target="#modal-content">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="text-green-500 hover:text-green-700 mr-2"
                                hx-get="/users/{{.ID}}/edit" hx-target="#modal-content">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="text-red-500 hover:text-red-700"
                                hx-delete="/users/{{.ID}}" 
                                hx-confirm="Are you sure you want to delete this user?">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>
    
    <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div id="modal-content" class="bg-white rounded-lg p-6 max-w-md w-full"></div>
    </div>
</div>

<script>
document.body.addEventListener('htmx:afterSwap', function(evt) {
    if (evt.target.id === 'modal-content') {
        document.getElementById('modal').classList.remove('hidden');
    }
});
</script>
{{end}}
