{{define "content"}}
<div x-data="permissions()">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-900 dark:text-gray-100">🔒 Permissions</h1>
        <button class="btn btn-primary" hx-get="/admin/permissions/create" hx-target="#modal-content" @click="showModal = true">
            <i class="fas fa-plus mr-2"></i>Add Permission
        </button>
    </div>
    
    <!-- Filters -->
    <div class="mb-4 flex flex-wrap gap-2">
        <input type="text" placeholder="Search permissions..." 
               class="form-control w-64" 
               @input.debounce="search($event.target.value)">
        
        <select class="form-control w-48" @change="filterByResource($event.target.value)">
            <option value="">All Resources</option>
            <option value="users">Users</option>
            <option value="roles">Roles</option>
            <option value="permissions">Permissions</option>
            <option value="system">System</option>
            <option value="apps">Applications</option>
        </select>
    </div>
    
    <!-- Table -->
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
        <table class="w-full">
            <thead class="bg-gray-50 dark:bg-gray-700/50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase">Name</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase">Display Name</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase">Resource</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase">Action</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
                <template x-for="perm in filteredPermissions" :key="perm.id">
                    <tr>
                        <td class="px-6 py-4 text-sm text-gray-900 dark:text-gray-100" x-text="perm.name"></td>
                        <td class="px-6 py-4 text-sm text-gray-900 dark:text-gray-100" x-text="perm.display_name"></td>
                        <td class="px-6 py-4">
                            <span class="badge badge-primary" x-text="perm.resource"></span>
                        </td>
                        <td class="px-6 py-4">
                            <span class="badge badge-secondary" x-text="perm.action"></span>
                        </td>
                        <td class="px-6 py-4">
                            <button class="text-blue-600 hover:text-blue-800 mr-2"
                                    hx-get="/admin/permissions/{{.ID}}" hx-target="#modal-content" @click="showModal = true">
                                <i class="fas fa-eye"></i>
                            </button>
                            <button class="text-red-600 hover:text-red-800"
                                    @click="deletePermission(perm.id)">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                </template>
                <tr x-show="filteredPermissions.length === 0">
                    <td colspan="5" class="px-6 py-8 text-center text-gray-500 dark:text-gray-400">
                        <i class="fas fa-inbox text-3xl mb-2 block"></i>
                        <p>No permissions found</p>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
function permissions() {
    return {
        permissions: [],
        filteredPermissions: [],
        searchTerm: '',
        resourceFilter: '',
        
        init() {
            this.loadPermissions();
        },
        
        loadPermissions() {
            fetch('/api/permissions')
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        this.permissions = data.data;
                        this.filteredPermissions = data.data;
                    }
                })
                .catch(() => {});
        },
        
        search(term) {
            this.searchTerm = term;
            this.applyFilters();
        },
        
        filterByResource(resource) {
            this.resourceFilter = resource;
            this.applyFilters();
        },
        
        applyFilters() {
            let filtered = this.permissions;
            
            if (this.searchTerm) {
                filtered = filtered.filter(p => 
                    p.name.toLowerCase().includes(this.searchTerm.toLowerCase()) ||
                    p.display_name.toLowerCase().includes(this.searchTerm.toLowerCase())
                );
            }
            
            if (this.resourceFilter) {
                filtered = filtered.filter(p => p.resource === this.resourceFilter);
            }
            
            this.filteredPermissions = filtered;
        },
        
        deletePermission(id) {
            if (!confirm('Are you sure you want to delete this permission?')) return;
            
            fetch(`/api/permissions/${id}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        this.loadPermissions();
                        showNotification('Success', 'Permission deleted successfully', 'success');
                    } else {
                        showNotification('Error', data.error || 'Failed to delete permission', 'danger');
                    }
                })
                .catch(() => {
                    showNotification('Error', 'Network error', 'danger');
                });
        }
    };
}
</script>
{{end}}
