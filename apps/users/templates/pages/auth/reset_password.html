{{define "content"}}
<div x-data="resetPassword()">
    <div class="text-center mb-8">
        <div class="text-4xl mb-2">🔐</div>
        <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100">Reset Password</h1>
        <p class="text-gray-600 dark:text-gray-400 text-sm mt-1">
            Enter your new password below
        </p>
    </div>
    
    <form @submit.prevent="resetPassword()">
        <div class="form-group">
            <label class="form-label" for="password">New Password</label>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500">
                    <i class="fas fa-lock"></i>
                </span>
                <input type="password" id="password" name="password" x-model="password"
                       class="w-full pl-10 pr-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 dark:bg-gray-700 dark:text-gray-100"
                       placeholder="Enter new password" required minlength="8">
            </div>
            <div class="text-xs text-gray-500 mt-1">At least 8 characters</div>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="password_confirmation">Confirm Password</label>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500">
                    <i class="fas fa-check-circle"></i>
                </span>
                <input type="password" id="password_confirmation" name="password_confirmation" x-model="password_confirmation"
                       class="w-full pl-10 pr-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 dark:bg-gray-700 dark:text-gray-100"
                       placeholder="Confirm new password" required>
            </div>
        </div>
        
        <button type="submit" class="w-full btn btn-primary" :disabled="loading">
            <span x-show="!loading">Reset Password</span>
            <span x-show="loading" class="flex items-center justify-center">
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Resetting...
            </span>
        </button>
    </form>
    
    <div class="mt-6 text-center">
        <a href="/auth/login" class="text-sm text-primary-600 dark:text-primary-400 hover:underline">
            <i class="fas fa-arrow-left mr-1"></i> Back to Login
        </a>
    </div>
</div>

<script>
function resetPassword() {
    return {
        password: '',
        password_confirmation: '',
        loading: false,
        
        resetPassword() {
            if (this.password !== this.password_confirmation) {
                showNotification('Error', 'Passwords do not match', 'danger');
                return;
            }
            
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            if (!token) {
                showNotification('Error', 'Invalid reset token', 'danger');
                return;
            }
            
            this.loading = true;
            
            fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    token: token,
                    password: this.password
                })
            })
            .then(res => res.json())
            .then(data => {
                this.loading = false;
                if (data.success) {
                    showNotification('Success', 'Password reset successfully!', 'success');
                    setTimeout(() => {
                        window.location.href = '/auth/login';
                    }, 2000);
                } else {
                    showNotification('Error', data.error || 'Failed to reset password', 'danger');
                }
            })
            .catch(() => {
                this.loading = false;
                showNotification('Error', 'Network error. Please try again.', 'danger');
            });
        }
    };
}
</script>
{{end}}
