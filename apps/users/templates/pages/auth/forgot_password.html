{{define "content"}}
<div x-data="{ loading: false, submitted: false }">
    <div class="text-center mb-8">
        <div class="text-4xl mb-2">🔑</div>
        <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100">Forgot Password</h1>
        <p class="text-gray-600 dark:text-gray-400 text-sm mt-1">
            Enter your email address and we'll send you a link to reset your password.
        </p>
    </div>
    
    <form @submit.prevent="resetPassword()" x-show="!submitted">
        <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500">
                    <i class="fas fa-envelope"></i>
                </span>
                <input type="email" id="email" name="email" x-model="email"
                       class="w-full pl-10 pr-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 dark:bg-gray-700 dark:text-gray-100"
                       placeholder="Enter your email" required>
            </div>
        </div>
        
        <button type="submit" class="w-full btn btn-primary" :disabled="loading">
            <span x-show="!loading">Send Reset Link</span>
            <span x-show="loading" class="flex items-center justify-center">
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Sending...
            </span>
        </button>
    </form>
    
    <div x-show="submitted" class="text-center p-4 bg-green-50 dark:bg-green-900/20 rounded-lg border border-green-200 dark:border-green-800">
        <i class="fas fa-check-circle text-green-500 text-3xl mb-2 block"></i>
        <h3 class="text-lg font-semibold text-green-700 dark:text-green-300">Check Your Email</h3>
        <p class="text-green-600 dark:text-green-400 text-sm mt-1">
            We've sent a password reset link to <strong x-text="email"></strong>
        </p>
        <p class="text-green-600 dark:text-green-400 text-sm mt-2">
            Didn't receive the email? <button @click="submitted = false" class="text-primary-600 hover:underline">Try again</button>
        </p>
    </div>
    
    <div class="mt-6 text-center">
        <a href="/auth/login" class="text-sm text-primary-600 dark:text-primary-400 hover:underline">
            <i class="fas fa-arrow-left mr-1"></i> Back to Login
        </a>
    </div>
</div>

<script>
function forgotPassword() {
    return {
        email: '',
        loading: false,
        submitted: false,
        
        resetPassword() {
            this.loading = true;
            
            fetch('/api/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: this.email })
            })
            .then(res => res.json())
            .then(data => {
                this.loading = false;
                if (data.success) {
                    this.submitted = true;
                } else {
                    showNotification('Error', data.error || 'Failed to send reset link', 'danger');
                }
            })
            .catch(() => {
                this.loading = false;
                showNotification('Error', 'Network error. Please try again.', 'danger');
            });
        }
    };
}
</script>
{{end}}
