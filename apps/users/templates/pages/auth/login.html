{{define "content"}}
<div class="text-center mb-6">
    <h1 class="text-2xl font-bold">🔐 NATS ERP</h1>
    <p class="text-gray-600">Welcome back! Please login to your account</p>
</div>

<form hx-post="/api/auth/login" hx-target="#result" hx-swap="innerHTML">
    <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="username">
            Username
        </label>
        <input type="text" id="username" name="username" 
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500"
               placeholder="Enter your username" required>
    </div>
    
    <div class="mb-6">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="password">
            Password
        </label>
        <input type="password" id="password" name="password" 
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500"
               placeholder="Enter your password" required>
    </div>
    
    <div class="mb-6 flex items-center justify-between">
        <label class="flex items-center">
            <input type="checkbox" name="remember" class="mr-2">
            <span class="text-sm text-gray-600">Remember me</span>
        </label>
        <a href="/auth/forgot-password" class="text-sm text-blue-500 hover:text-blue-700">
            Forgot password?
        </a>
    </div>
    
    <button type="submit" 
            class="w-full bg-blue-500 text-white py-2 px-4 rounded-lg hover:bg-blue-600 transition duration-200">
        Login
    </button>
    
    <div id="result" class="mt-4"></div>
</form>

<div class="mt-6 text-center">
    <p class="text-sm text-gray-600">
        Don't have an account? 
        <a href="/auth/register" class="text-blue-500 hover:text-blue-700">Register</a>
    </p>
</div>
{{end}}
