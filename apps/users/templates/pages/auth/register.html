{{define "content"}}
<div x-data="register()">
    <div class="text-center mb-8">
        <div class="text-4xl mb-2">📝</div>
        <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100">Create Account</h1>
        <p class="text-gray-600 dark:text-gray-400 text-sm mt-1">
            Join NATS ERP and start managing your business
        </p>
    </div>
    
    <form @submit.prevent="register()">
        <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500">
                    <i class="fas fa-user"></i>
                </span>
                <input type="text" id="username" name="username" x-model="user.username"
                       class="w-full pl-10 pr-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 dark:bg-gray-700 dark:text-gray-100"
                       placeholder="Choose a username" required minlength="3" maxlength="50">
            </div>
            <div class="text-xs text-gray-500 mt-1">3-50 characters</div>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500">
                    <i class="fas fa-envelope"></i>
                </span>
                <input type="email" id="email" name="email" x-model="user.email"
                       class="w-full pl-10 pr-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 dark:bg-gray-700 dark:text-gray-100"
                       placeholder="Enter your email" required>
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="full_name">Full Name</label>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500">
                    <i class="fas fa-id-card"></i>
                </span>
                <input type="text" id="full_name" name="full_name" x-model="user.full_name"
                       class="w-full pl-10 pr-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 dark:bg-gray-700 dark:text-gray-100"
                       placeholder="Enter your full name">
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500">
                    <i class="fas fa-lock"></i>
                </span>
                <input type="password" id="password" name="password" x-model="user.password"
                       class="w-full pl-10 pr-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 dark:bg-gray-700 dark:text-gray-100"
                       placeholder="Create a password" required minlength="8">
            </div>
            <div class="text-xs text-gray-500 mt-1">At least 8 characters</div>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="password_confirmation">Confirm Password</label>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500">
                    <i class="fas fa-check-circle"></i>
                </span>
                <input type="password" id="password_confirmation" name="password_confirmation" x-model="user.password_confirmation"
                       class="w-full pl-10 pr-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 dark:bg-gray-700 dark:text-gray-100"
                       placeholder="Confirm your password" required>
            </div>
        </div>
        
        <div class="form-group flex items-center gap-2">
            <input type="checkbox" id="terms" x-model="user.terms" required>
            <label for="terms" class="text-sm text-gray-600 dark:text-gray-400">
                I agree to the <a href="/terms" class="text-primary-600 hover:underline">Terms of Service</a> and 
                <a href="/privacy" class="text-primary-600 hover:underline">Privacy Policy</a>
            </label>
        </div>
        
        <button type="submit" class="w-full btn btn-primary" :disabled="loading">
            <span x-show="!loading">Create Account</span>
            <span x-show="loading" class="flex items-center justify-center">
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Creating Account...
            </span>
        </button>
    </form>
    
    <div class="mt-6 text-center">
        <p class="text-sm text-gray-600 dark:text-gray-400">
            Already have an account? 
            <a href="/auth/login" class="text-primary-600 dark:text-primary-400 hover:underline font-medium">Login</a>
        </p>
    </div>
</div>

<script>
function register() {
    return {
        user: {
            username: '',
            email: '',
            full_name: '',
            password: '',
            password_confirmation: '',
            terms: false
        },
        loading: false,
        
        register() {
            if (this.user.password !== this.user.password_confirmation) {
                showNotification('Error', 'Passwords do not match', 'danger');
                return;
            }
            
            this.loading = true;
            
            fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(this.user)
            })
            .then(res => res.json())
            .then(data => {
                this.loading = false;
                if (data.success) {
                    showNotification('Success', 'Account created successfully! Please login.', 'success');
                    setTimeout(() => {
                        window.location.href = '/auth/login';
                    }, 2000);
                } else {
                    showNotification('Error', data.error || 'Registration failed', 'danger');
                }
            })
            .catch(() => {
                this.loading = false;
                showNotification('Error', 'Network error. Please try again.', 'danger');
            });
        }
    };
}
</script>
{{end}}
