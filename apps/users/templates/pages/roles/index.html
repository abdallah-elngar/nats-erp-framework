{{define "content"}}
<div x-data="roles()">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-900 dark:text-gray-100">👥 Roles</h1>
        <button class="btn btn-primary" hx-get="/admin/roles/create" hx-target="#modal-content" @click="showModal = true">
            <i class="fas fa-plus mr-2"></i>Add Role
        </button>
    </div>
    
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
        <table class="w-full">
            <thead class="bg-gray-50 dark:bg-gray-700/50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase">Name</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase">Display Name</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase">Permissions</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
                {{range .Roles}}
                <tr>
                    <td class="px-6 py-4 text-sm text-gray-900 dark:text-gray-100">
                        {{.Name}}
                        {{if .IsSystem}}<span class="badge badge-primary ml-2">System</span>{{end}}
                        {{if .IsDefault}}<span class="badge badge-success ml-2">Default</span>{{end}}
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-900 dark:text-gray-100">{{.DisplayName}}</td>
                    <td class="px-6 py-4 text-sm text-gray-500 dark:text-gray-400">
                        {{len .Permissions}} permissions
                    </td>
                    <td class="px-6 py-4">
                        <button class="text-blue-600 hover:text-blue-800 mr-2"
                                hx-get="/admin/roles/{{.ID}}/edit" hx-target="#modal-content" @click="showModal = true">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="text-blue-500 hover:text-blue-700 mr-2"
                                hx-get="/admin/roles/{{.ID}}/permissions" hx-target="#modal-content" @click="showModal = true">
                            <i class="fas fa-lock"></i>
                        </button>
                        {{if not .IsSystem}}
                        <button class="text-red-600 hover:text-red-800" @click="deleteRole({{.ID}})">
                            <i class="fas fa-trash"></i>
                        </button>
                        {{end}}
                    </td>
                </tr>
                {{else}}
                <tr>
                    <td colspan="4" class="px-6 py-8 text-center text-gray-500 dark:text-gray-400">
                        <i class="fas fa-users text-3xl mb-2 block"></i>
                        <p>No roles found</p>
                    </td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>
</div>

<script>
function roles() {
    return {
        deleteRole(id) {
            if (!confirm('Are you sure you want to delete this role?')) return;
            
            fetch(`/api/roles/${id}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        window.location.reload();
                    } else {
                        showNotification('Error', data.error || 'Failed to delete role', 'danger');
                    }
                })
                .catch(() => {
                    showNotification('Error', 'Network error', 'danger');
                });
        }
    };
}
</script>
{{end}}
