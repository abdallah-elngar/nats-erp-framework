{{define "content"}}
<div class="p-6">
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-gray-900 dark:text-gray-100">Create New Role</h2>
        <button class="text-gray-500 hover:text-gray-700" @click="showModal = false">
            <i class="fas fa-times"></i>
        </button>
    </div>
    
    <form hx-post="/api/roles" hx-target="#modal-content" hx-swap="innerHTML" data-validate>
        <div class="form-group">
            <label class="form-label" for="name">Role Name</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="e.g., manager" required>
            <small class="text-gray-500 text-sm">Unique identifier (lowercase, no spaces)</small>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="display_name">Display Name</label>
            <input type="text" class="form-control" id="display_name" name="display_name" placeholder="e.g., Manager" required>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="description">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3" placeholder="Describe the role..."></textarea>
        </div>
        
        <div class="form-group">
            <label class="form-label">Permissions</label>
            <div class="border border-gray-300 dark:border-gray-600 rounded-lg p-4 max-h-60 overflow-y-auto">
                <div class="flex items-center gap-2 mb-3">
                    <input type="checkbox" id="select_all" @change="toggleAllPermissions($event)">
                    <label for="select_all" class="text-sm font-medium">Select All</label>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    {{range .Permissions}}
                    <label class="flex items-center gap-2 text-sm cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700/50 p-1 rounded">
                        <input type="checkbox" name="permissions" value="{{.ID}}">
                        <span>{{.DisplayName}}</span>
                    </label>
                    {{end}}
                </div>
            </div>
        </div>
        
        <div class="flex justify-end gap-2 mt-4">
            <button type="button" class="btn btn-secondary" @click="showModal = false">Cancel</button>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save mr-2"></i>Create Role
            </button>
        </div>
    </form>
</div>

<script>
function toggleAllPermissions(event) {
    const checkboxes = document.querySelectorAll('input[name="permissions"]');
    checkboxes.forEach(cb => cb.checked = event.target.checked);
}
</script>
{{end}}
