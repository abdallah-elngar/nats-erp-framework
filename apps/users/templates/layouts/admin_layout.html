{{define "content"}}
<!DOCTYPE html>
<html lang="{{.Locale}}" x-data="{ theme: localStorage.getItem('theme') || 'light' }" :class="theme">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} | NATS ERP - Admin</title>
    
    <link rel="stylesheet" href="/static/css/tailwind/tailwind.min.css">
    <link rel="stylesheet" href="/static/fonts/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <link rel="stylesheet" href="/static/css/themes/{{.Theme}}.css">
    
    <script src="/static/js/htmx/htmx.min.js"></script>
    <script src="/static/js/alpine/alpine.min.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/admin.js"></script>
</head>
<body>
    <div id="app" x-data="adminApp()" class="min-h-screen bg-gray-50 dark:bg-gray-900">
        <!-- Admin Navbar -->
        <nav class="fixed top-0 left-0 right-0 z-50 bg-white dark:bg-gray-800 shadow-sm">
            <div class="flex items-center justify-between h-16 px-4">
                <div class="flex items-center gap-3">
                    <button @click="toggleSidebar()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
                        <i class="fas fa-bars text-gray-700 dark:text-gray-300 text-xl"></i>
                    </button>
                    <a href="/admin" class="flex items-center gap-2">
                        <img src="/static/images/logo.svg" alt="NATS" class="h-8 w-8">
                        <span class="text-xl font-bold text-primary-600 dark:text-primary-400">NATS ERP</span>
                    </a>
                </div>
                
                <div class="flex items-center gap-3">
                    <button @click="theme = theme === 'light' ? 'dark' : 'light'; localStorage.setItem('theme', theme)" 
                            class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
                        <i class="fas fa-moon text-gray-700 dark:text-gray-300 text-lg" x-show="theme === 'light'"></i>
                        <i class="fas fa-sun text-gray-700 dark:text-gray-300 text-lg" x-show="theme === 'dark'"></i>
                    </button>
                    
                    <div class="relative" x-data="{ open: false }">
                        <button @click="open = !open" class="flex items-center gap-2 p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
                            <div class="w-8 h-8 rounded-full bg-primary-500 flex items-center justify-center text-white font-bold">
                                {{.User.Initials}}
                            </div>
                            <span class="text-sm text-gray-700 dark:text-gray-300">{{.User.FullName}}</span>
                            <i class="fas fa-chevron-down text-xs text-gray-500"></i>
                        </button>
                        
                        <div x-show="open" @click.away="open = false"
                             class="absolute right-0 mt-2 w-48 bg-white dark:bg-gray-800 rounded-lg shadow-lg border border-gray-200 dark:border-gray-700">
                            <div class="py-1">
                                <a href="/admin/profile" class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                                    <i class="fas fa-user mr-2"></i>Profile
                                </a>
                                <a href="/admin/settings" class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                                    <i class="fas fa-cog mr-2"></i>Settings
                                </a>
                                <hr class="my-1 border-gray-200 dark:border-gray-700">
                                <button @click="logout()" class="w-full text-left block px-4 py-2 text-sm text-red-600 dark:text-red-400 hover:bg-gray-100 dark:hover:bg-gray-700">
                                    <i class="fas fa-sign-out-alt mr-2"></i>Logout
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
        
        <!-- Admin Sidebar -->
        <aside x-show="sidebarOpen"
               x-transition:enter="transition ease-out duration-300"
               x-transition:enter-start="-translate-x-full"
               x-transition:enter-end="translate-x-0"
               class="fixed top-16 left-0 bottom-0 w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 overflow-y-auto z-40">
            <nav class="p-4">
                {{template "admin_sidebar" .}}
            </nav>
        </aside>
        
        <!-- Main Content -->
        <main class="pt-16 transition-all duration-300" :class="sidebarOpen ? 'ml-64' : 'ml-0'">
            <div class="p-6">
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-6 border border-gray-200 dark:border-gray-700">
                    {{template "page_content" .}}
                </div>
            </div>
        </main>
    </div>
</body>
</html>
{{end}}
