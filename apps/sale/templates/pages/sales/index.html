{{define "content"}}
<div class="container mx-auto p-4">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">📦 Sale</h1>
        <button class="btn btn-primary" hx-get="/sale/sales/create" hx-target="#modal-content" @click="showModal = true">
            <i class="fas fa-plus mr-2"></i>Add Sale
        </button>
    </div>

    <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="w-full">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">SA_NAME</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">PRICE</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">QUANTITY</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
                {{range .Items}}
                <tr>
                    <td class="px-6 py-4">{{.ID}}</td>
<td class="px-6 py-4">{{.SaName}}</td>
                    <td class="px-6 py-4">{{.Price}}</td>
                    <td class="px-6 py-4">{{.Quantity}}</td>
                    <td class="px-6 py-4">
                        <button class="text-blue-600 hover:text-blue-800 mr-2"
                                hx-get="/sale/sales/{{.ID}}" hx-target="#modal-content" @click="showModal = true">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="text-green-600 hover:text-green-800 mr-2"
                                hx-get="/sale/sales/{{.ID}}/edit" hx-target="#modal-content" @click="showModal = true">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="text-red-600 hover:text-red-800"
                                hx-delete="/sale/sales/{{.ID}}" hx-confirm="Are you sure?">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
                {{else}}
                <tr>
                    <td colspan="10" class="px-6 py-4 text-center text-gray-500">No sales found</td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>
</div>
{{end}}
