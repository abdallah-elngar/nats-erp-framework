{{define "content"}}
<div class="container mx-auto p-4">
    <h1 class="text-2xl font-bold mb-4">➕ Create Sale</h1>
    <form hx-post="/sale/sales" hx-target="#result" hx-swap="innerHTML" class="bg-white rounded-lg shadow p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="form-group">
                <label class="form-label">SA_NAME</label>
                <input type="text" name="sa_name" class="form-control" placeholder="Enter sa_name" required>
            </div>
            <div class="form-group">
                <label class="form-label">PRICE</label>
                <input type="number" name="price" class="form-control" placeholder="Enter price" required>
            </div>
            <div class="form-group">
                <label class="form-label">QUANTITY</label>
                <input type="number" name="quantity" class="form-control" placeholder="Enter quantity" required>
            </div>
        </div>
        <div class="mt-4 flex gap-2">
            <button type="submit" class="btn btn-primary">💾 Save</button>
            <button type="button" class="btn btn-secondary" onclick="history.back()">↩️ Cancel</button>
        </div>
        <div id="result" class="mt-4"></div>
    </form>
</div>
{{end}}
