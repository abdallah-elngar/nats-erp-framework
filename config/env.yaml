# ============================================
# Environment Configuration
# ============================================

# بيئة التشغيل
app_env: development
app_debug: true
app_timezone: UTC
app_locale: en

# خادم HTTP
http_host: 0.0.0.0
http_port: 8080

# قاعدة البيانات
db_driver: postgres
db_host: localhost
db_port: 5432
db_user: postgres
db_password: admin
db_name: nats_db

# Redis
redis_host: localhost
redis_port: 6379
redis_password: ""
redis_db: 0

# JWT
jwt_secret: change-this-secret-in-production
jwt_expiration: 24h
jwt_refresh_expiration: 7d

# التخزين
storage_driver: local
storage_path: storage/app

# البريد الإلكتروني
mail_host: smtp.gmail.com
mail_port: 587
mail_username: ""
mail_password: ""
mail_encryption: tls
mail_from: "nats@example.com"
mail_from_name: "NATS ERP"

# التسجيل
log_level: debug
log_channel: file
log_path: storage/logs/app.log
log_format: text

# الأمان
csrf_enabled: true
cors_enabled: true
rate_limit_enabled: true
rate_limit: 100
rate_limit_window: 1m

# الجلسات
session_driver: memory
session_lifetime: 120
session_secure: false
session_domain: ""
session_path: "/"
session_http_only: true
session_same_site: lax

# التخزين المؤقت
cache_driver: memory
cache_prefix: "nats:"
cache_ttl: 3600

# المهام المجدولة
scheduler_enabled: true
scheduler_timezone: UTC

# الطوابير
queue_driver: memory
queue_workers: 4
queue_timeout: 60s

# WebSocket
websocket_enabled: true
websocket_path: /ws

# الملفات الثابتة
static_path: /static
static_dir: static
media_path: /media
media_dir: storage/uploads

# القوالب
template_cache_enabled: true
template_path: templates

# المصادقة
auth_enabled: true
auth_driver: jwt
auth_guest_redirect: /login
auth_guard: web

# الوضع الليلي (Dark Mode)
dark_mode_enabled: true
dark_mode_default: false

# واجهة برمجة التطبيقات (API)
api_enabled: true
api_version: v1
api_prefix: /api
api_rate_limit: 60
api_rate_limit_window: 1m

# التقرير
report_enabled: true
report_path: storage/reports
report_auto_generate: false

# النسخ الاحتياطي
backup_enabled: true
backup_path: storage/backups
backup_auto: false
backup_interval: 24h
backup_retention: 30

# التحديث التلقائي
auto_reload: true
hot_reload: true
watch_interval: 1s

# السمات (Themes)
themes_enabled: true
themes_default: light
themes_available:
  - light
  - dark
  - blue
  - green
  - red